<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timecard Tracker tests</title>
  <meta name="color-scheme" content="light dark">
  <style>
    body {
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      margin: 2rem auto;
      max-width: 60rem;
      padding: 0 1rem;
    }
    h1 { font-size: 1.2rem; }
    #summary { font-size: 1.05rem; font-weight: 700; padding: 0.5rem 0.75rem; border-radius: 8px; display: inline-block; }
    #summary.ok { background: #e2f3ea; color: #15603a; }
    #summary.fail { background: #fbe6e5; color: #a01b14; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.2rem 0.5rem; border-left: 3px solid transparent; }
    li.ok { color: #2f7d52; border-left-color: #2f7d52; }
    li.fail { color: #c0392b; border-left-color: #c0392b; background: rgba(192, 57, 43, 0.07); }
    pre { margin: 0.25rem 0 0.5rem 1.5rem; white-space: pre-wrap; color: inherit; }
    a { color: inherit; }
    @media (prefers-color-scheme: dark) {
      body { background: #14161a; color: #e8eaee; }
      #summary.ok { background: #1c2f26; color: #6ed3a0; }
      #summary.fail { background: #3a1f1d; color: #f28b82; }
      li.ok { color: #6ed3a0; border-left-color: #6ed3a0; }
      li.fail { color: #f28b82; border-left-color: #f28b82; }
    }
  </style>
</head>
<body>
  <h1>Timecard Tracker — unit tests</h1>
  <p><a href="../index.html">&larr; back to the app</a> &middot; <a href="./ui-smoke.html">UI smoke test</a></p>
  <p id="summary">running…</p>
  <ul id="results"></ul>

  <script type="module">
    import { run } from './runner.js';
    // Importing a test module registers its cases with the runner.
    import './payperiod.test.js';
    import './calc.test.js';
    import './exporters.test.js';
    run();
  </script>
</body>
</html>
