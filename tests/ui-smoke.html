<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timecard Tracker UI smoke test</title>
  <meta name="color-scheme" content="light dark">
  <style>
    body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; }
    h1 { font-size: 1.2rem; }
    #out { white-space: pre-wrap; }
    /* The app markup is loaded only to drive it; keep it out of the way. */
    #app-root { display: none; }
    @media (prefers-color-scheme: dark) { body { background: #14161a; color: #e8eaee; } a { color: #7fa0ff; } }
  </style>
</head>
<body>
<h1>Timecard Tracker — UI smoke test</h1>
<p><a href="./index.html">unit tests</a> · <a href="../index.html">back to the app</a></p>
<p>Drives the real <code>index.html</code> markup through <code>ui.js</code>: adding codes,
entering hours, filling, navigating periods, and exporting. Your saved timecard is
snapshotted and restored when the run finishes.</p>
<pre id="out">running…</pre>
<div id="app-root"></div>
<script type="module">
const STORAGE_KEY = 'timecard-tracker/v1';
// This test writes to the same localStorage key the app uses, so stash whatever
// is really saved and put it back before we finish.
const savedData = localStorage.getItem(STORAGE_KEY);
const restore = () => {
  if (savedData === null) localStorage.removeItem(STORAGE_KEY);
  else localStorage.setItem(STORAGE_KEY, savedData);
};
window.addEventListener('pagehide', restore);

const log = [];
let failures = 0;
const check = (name, actual, expected) => {
  const ok = String(actual) === String(expected);
  if (!ok) failures += 1;
  log.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : `\n        expected: ${expected}\n        actual:   ${actual}`}`);
};

try {
  // Load the real index.html markup into this document so ui.js finds its IDs.
  const html = await (await fetch('../index.html')).text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const root = document.getElementById('app-root');
  for (const node of [...doc.body.children]) {
    if (node.tagName !== 'SCRIPT') root.append(document.importNode(node, true));
  }

  localStorage.removeItem(STORAGE_KEY);
  const store = await import('../src/state.js');
  const ui = await import('../src/ui.js');
  const { buildCSV } = await import('../src/exporters.js');

  const ctx = { state: store.loadState(), requestSave() { store.saveState(ctx.state); }, actions: {
    exportCSV() {}, exportJSON() {}, importJSON() { return { ok: true }; },
  } };
  ctx.state.anchorPeriodStart = '2026-08-01';
  ctx.state.activePeriodStart = '2026-08-01';
  ui.mount(ctx);

  const $ = (id) => document.getElementById(id);
  const q = (sel) => document.querySelector(sel);
  const fire = (el, type = 'input') => el.dispatchEvent(new Event(type, { bubbles: true }));
  const setVal = (el, value) => { el.value = value; fire(el); };
  const text = (id) => $(id).textContent.trim();

  // Days are columns now, so a day's cells are found by date, not by row.
  const chargeCode = (date, code) => {
    const input = q(`input[aria-label="${code} hours ${date}"]`);
    if (!input) throw new Error(`${code} has no hours box on ${date}`);
    return input;
  };
  const cell = (date, sel) => {
    const el = q(`td[data-date="${date}"]${sel}`);
    if (!el) throw new Error(`no ${sel} cell on ${date}`);
    return el;
  };
  const worked = (date) => cell(date, '.worked').querySelector('span').textContent;
  const target = (date) => cell(date, '.worked').querySelector('.worked__target').textContent;
  const chip = (date) => cell(date, '.balance').querySelector('.chip').textContent;
  const fillBtn = (date) => cell(date, '.balance').querySelector('.fill-btn');
  const total = (weekIndex, key) => q(`[data-total="${weekIndex}:${key}"]`).textContent;

  // --- the scratch time calculator ----------------------------------------
  // The static "not loaded" fallback must be gone once the grid has drawn.
  check('day grid replaced its fallback note', document.querySelectorAll('.grid-fallback').length, 0);
  check('day grid drew both weeks', document.querySelectorAll('#weeks .week').length, 2);

  check('calculator starts empty', text('calc-hours'), '—');
  setVal($('calc-start'), '07:30');
  check('one time alone is not enough', text('calc-hours'), '—');
  check('and says so', text('calc-note'), 'Needs both a start and an end time.');
  setVal($('calc-end'), '17:00');
  check('calculates the span', text('calc-hours'), '9.5 hrs');
  check('and shows it exactly', text('calc-note'), '9h 30m');
  setVal($('calc-start'), '08:00');
  setVal($('calc-end'), '16:20');
  check('rounds to the tenth', text('calc-hours'), '8.3 hrs'); // 8h20m is 8.333
  check('exact minutes unrounded', text('calc-note'), '8h 20m');
  setVal($('calc-start'), '22:00');
  setVal($('calc-end'), '06:00');
  check('calculator handles overnight', text('calc-hours'), '8.0 hrs');
  check('and flags it', text('calc-note'), '8h 00m · crosses midnight');
  $('calc-clear').click();
  check('clear resets the calculator', text('calc-hours'), '—');
  check('clear empties the inputs', $('calc-start').value + $('calc-end').value, '');

  check('period range', text('period-range'), 'Aug 1 – Aug 14, 2026');
  check('anchor input value', $('anchor-input').value, '2026-08-01');
  check('pto label input', $('pto-label-input').value, 'PTO');
  check('copy-codes disabled with no previous period', $('copy-codes').disabled, 'true');

  // --- add charge codes through the real form -----------------------------
  const form = $('code-form');
  $('code-input').value = 'PROJ-A';
  $('code-label').value = 'Platform';
  form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));

  $('code-input').value = 'PROJ-A-OT';
  form.querySelector('input[value="overtime"]').checked = true;
  form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));

  check('two code chips rendered', document.querySelectorAll('.code-chip').length, 2);
  check('a week is seven days plus a label and a total column',
    document.querySelectorAll('.grid')[0].querySelectorAll('thead th').length, 9);
  check('both weeks rendered', document.querySelectorAll('.grid').length, 2);
  check('one grid row per charge code per week',
    document.querySelectorAll('.grid__row--code').length, 4);
  check('every day gets a box for every charge code',
    document.querySelectorAll('td.alloc').length, 28);
  check('all charge-code boxes start blank',
    [...document.querySelectorAll('.alloc__hours')].every((i) => i.value === ''), 'true');
  check('hours step in tenths', q('.alloc__hours').step, '0.1');
  check('PTO steps in tenths too', q('input[aria-label^="PTO hours"]').step, '0.1');
  check('break is entered in minutes', q('input[aria-label^="Break minutes"]').step, '5');
  check('the break row says so', [...document.querySelectorAll('.grid__label')]
    .some((th) => th.textContent === 'Break (min)'), 'true');
  check('overtime codes are marked on their row',
    document.querySelectorAll('.grid__code-type').length, 2);
  check('days run across the top', q('.grid thead .grid__day-dow').textContent, 'Sat');

  // duplicate rejected
  $('code-input').value = 'proj-a';
  form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  check('duplicate code rejected', $('code-error').hidden, 'false');
  check('still two codes', document.querySelectorAll('.code-chip').length, 2);

  // --- enter a day --------------------------------------------------------
  const D = '2026-08-03'; // Monday of week 1
  setVal(q(`input[aria-label="Start time ${D}"]`), '07:30');
  setVal(q(`input[aria-label="End time ${D}"]`), '17:00');
  setVal(q(`input[aria-label="Break minutes ${D}"]`), '30');

  check('worked hours computed', worked(D), '9.00');
  check('chip shows unallocated', chip(D), '9.00 unallocated');
  check('fill button visible', fillBtn(D).hidden, 'false');
  check('week column totals worked hours', total(0, 'worked'), '9.00');
  check('week column totals break minutes', total(0, 'break'), '30');

  // A break that is not a whole tenth of an hour is still exact.
  setVal(q(`input[aria-label="Break minutes ${D}"]`), '20');
  check('a 20-minute break comes off the span', worked(D), '9.17');
  setVal(q(`input[aria-label="Break minutes ${D}"]`), '30');

  // --- charging a day across codes ----------------------------------------
  setVal(chargeCode(D, 'PROJ-A'), '6');
  check('chip after partial split', chip(D), '3.00 unallocated');
  setVal(chargeCode(D, 'PROJ-A-OT'), '3');
  check('chip balanced', chip(D), '✓ balanced');
  check('both codes still have a box on the day',
    document.querySelectorAll(`td.alloc[data-date="${D}"]`).length, 2);
  check('week column totals the code row', total(0, `code:${ctx.state.periods['2026-08-01'].codes[0].id}`), '6.00');
  check('week balance chip', q('[data-total="0:balance"] .chip').textContent, '✓ balanced');

  // tenth-of-an-hour entry
  setVal(chargeCode(D, 'PROJ-A'), '6.1');
  check('tenths accepted', chip(D), '0.10 over worked');
  setVal(chargeCode(D, 'PROJ-A-OT'), '2.9');
  check('tenths balance out', chip(D), '✓ balanced');
  setVal(chargeCode(D, 'PROJ-A'), '6');
  setVal(chargeCode(D, 'PROJ-A-OT'), '3');
  check('regular stat', text('stat-regular'), '6.00');
  check('overtime stat', text('stat-ot'), '3.00');
  check('ot note', text('stat-ot-note'), 'charged to overtime codes');
  check('remaining stat', text('stat-remaining'), '74.00');
  check('total paid', text('stat-total'), '9.00');
  check('per-code chip total', q('[data-code-total]').textContent, '6.00 hrs');
  check('week 1 totals', q('[data-week-totals="0"]').textContent, 'Worked 9.00 of 40');

  // over-allocation
  setVal(q(`input[aria-label="PROJ-A hours ${D}"]`), '8');
  check('chip over worked', chip(D), '2.00 over worked');
  check('input flagged over', q(`input[aria-label="PROJ-A hours ${D}"]`).classList.contains('is-over'), 'true');
  setVal(q(`input[aria-label="PROJ-A hours ${D}"]`), '6');

  // --- fill button --------------------------------------------------------
  const D2 = '2026-08-04';
  setVal(q(`input[aria-label="Start time ${D2}"]`), '09:00');
  setVal(q(`input[aria-label="End time ${D2}"]`), '17:00');
  fillBtn(D2).click();
  check('fill balances the day', chip(D2), '✓ balanced');
  check('fill targeted last-used code', q(`input[aria-label="PROJ-A hours ${D2}"]`).value, '8');

  // --- clearing a day's hours releases them -------------------------------
  const D5 = '2026-08-08';
  setVal(q(`input[aria-label="Start time ${D5}"]`), '10:00');
  setVal(q(`input[aria-label="End time ${D5}"]`), '14:00');
  setVal(chargeCode(D5, 'PROJ-A'), '4');
  check('day balanced on one code', chip(D5), '✓ balanced');
  setVal(chargeCode(D5, 'PROJ-A'), '');
  check('cleared hours go back to unallocated', chip(D5), '4.00 unallocated');
  check('the code box stays on the day',
    document.querySelectorAll(`td.alloc[data-date="${D5}"]`).length, 2);
  setVal(q(`input[aria-label="Start time ${D5}"]`), '');
  setVal(q(`input[aria-label="End time ${D5}"]`), '');

  // --- overnight ----------------------------------------------------------
  const D3 = '2026-08-05';
  setVal(q(`input[aria-label="Start time ${D3}"]`), '22:00');
  setVal(q(`input[aria-label="End time ${D3}"]`), '06:00');
  check('overnight hours', worked(D3), '8.00');
  check('overnight hint shown', cell(D3, '.worked').querySelector('.worked__overnight').hidden, 'false');
  check('other days show no overnight hint',
    cell(D2, '.worked').querySelector('.worked__overnight').hidden, 'true');
  setVal(chargeCode(D3, 'PROJ-A'), '8');

  // --- PTO ----------------------------------------------------------------
  const D4 = '2026-08-06';
  setVal(q(`input[aria-label="PTO hours ${D4}"]`), '8');
  check('pto stat', text('stat-pto'), '8.00');
  check('regular includes pto', text('stat-regular'), '30.00'); // 6+8+8 worked reg + 8 pto
  check('regular note', text('stat-regular-note'), '22.00 worked + 8.00 PTO');
  check('pto day chip', chip(D4), '8.00 PTO');
  check('pto totals in the week column', total(0, 'pto'), '8.00');
  check('overtime unchanged by pto', text('stat-ot'), '3.00');

  // --- persistence + period navigation ------------------------------------
  store.flushSave(ctx.state);
  const reloaded = store.loadState();
  check('saved to localStorage', reloaded.periods['2026-08-01'].days[D].alloc ? 'yes' : 'no', 'yes');
  check('reloaded worked start', reloaded.periods['2026-08-01'].days[D].start, '07:30');

  $('next-period').click();
  check('advanced two weeks', text('period-range'), 'Aug 15 – Aug 28, 2026');
  check('new period has no codes', document.querySelectorAll('.code-chip').length, 0);
  check('no codes means no code rows', document.querySelectorAll('.grid__row--code').length, 0);
  check('the entry rows survive with no codes', document.querySelectorAll('.grid').length, 2);
  check('empty week totals show a dash', total(0, 'worked'), '—');
  check('new period totals reset', text('stat-regular'), '0.00');
  check('copy-codes now enabled', $('copy-codes').disabled, 'false');

  $('copy-codes').click();
  check('codes copied forward', document.querySelectorAll('.code-chip').length, 2);
  check('copied codes carry no hours', q('[data-code-total]').textContent, '0.00 hrs');

  $('prev-period').click();
  check('back to first period', text('period-range'), 'Aug 1 – Aug 14, 2026');
  check('hours survived the round trip', q(`input[aria-label="PROJ-A hours ${D}"]`).value, '6');

  // --- over-80 spill ------------------------------------------------------
  for (const date of ['2026-08-07','2026-08-10','2026-08-11','2026-08-12','2026-08-13','2026-08-14']) {
    setVal(q(`input[aria-label="Start time ${date}"]`), '08:00');
    setVal(q(`input[aria-label="End time ${date}"]`), '20:00');
    setVal(chargeCode(date, 'PROJ-A'), '12');
  }
  // regular worked: 6 + 8 + 8 + 72 = 94  -> 80 regular + 14 spill, plus 3 on the OT code
  check('spill: regular capped', text('stat-regular'), '88.00'); // 80 worked + 8 PTO
  check('spill: overtime total', text('stat-ot'), '17.00'); // 3 OT-code + 14 spill
  check('spill: ot note', text('stat-ot-note'), '3.00 on OT codes + 14.00 over 80');
  check('spill: remaining zero', text('stat-remaining'), '0.00');
  check('spill: over-cap note', text('stat-regular-note'), '80.00 worked + 8.00 PTO — over 80');

  // --- CSV ----------------------------------------------------------------
  const csv = buildCSV(ctx.state, '2026-08-01').split('\r\n');
  check('csv header', csv[0], 'date,weekday,charge_code,type,hours');
  check('csv first row', csv[1], '2026-08-03,Mon,PROJ-A,regular,6.00');
  check('csv ot row', csv[2], '2026-08-03,Mon,PROJ-A-OT,overtime,3.00');
  check('csv pto row', csv.find((r) => r.includes('PTO')), '2026-08-06,Thu,PTO,pto,8.00');
  const csvSum = csv.slice(1).reduce((s, r) => s + Number(r.split(',')[4]), 0);
  check('csv sums to total paid', csvSum.toFixed(2), '105.00'); // 88 regular + 17 OT

  // --- code removal clears its hours --------------------------------------
  const originalConfirm = window.confirm;
  window.confirm = () => true;
  document.querySelectorAll('.code-chip__remove')[1].click(); // PROJ-A-OT
  window.confirm = originalConfirm;
  check('code removed', document.querySelectorAll('.code-chip').length, 1);
  check('its hours removed from OT', text('stat-ot'), '14.00');

  // --- the same code under both charging types ----------------------------
  $('code-input').value = 'PROJ-A';
  $('code-label').value = 'Platform, overtime';
  form.querySelector('input[value="overtime"]').checked = true;
  form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  check('same code accepted under the other type', $('code-error').hidden, 'true');
  check('now two codes named PROJ-A', document.querySelectorAll('.code-chip').length, 2);
  check('a row each per week', document.querySelectorAll('.grid__row--code').length, 4);
  check('both rows are tagged with their type',
    document.querySelectorAll('.grid__code-type').length, 4);
  check('the twins get distinct labels',
    q(`input[aria-label="PROJ-A regular hours ${D}"]`).value, '6');
  check('the overtime twin starts empty',
    q(`input[aria-label="PROJ-A overtime hours ${D}"]`).value, '');

  setVal(q(`input[aria-label="PROJ-A overtime hours ${D}"]`), '2');
  check('the overtime twin charges overtime', text('stat-ot'), '16.00');
  check('the regular twin is untouched', q(`input[aria-label="PROJ-A regular hours ${D}"]`).value, '6');

  // a third PROJ-A of a type already present is still refused
  $('code-input').value = 'proj-a';
  form.querySelector('input[value="overtime"]').checked = true;
  form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  check('a second overtime PROJ-A is refused', $('code-error').hidden, 'false');
  check('error names the type', $('code-error').textContent,
    'proj-a is already in this pay period as an overtime code.');
  check('still two codes named PROJ-A', document.querySelectorAll('.code-chip').length, 2);

  const twinCsv = buildCSV(ctx.state, '2026-08-01').split('\r\n');
  check('csv keeps the twins on separate rows',
    twinCsv.filter((r) => r.startsWith(`${D},Mon,PROJ-A,`)).join(' | '),
    `${D},Mon,PROJ-A,regular,6.00 | ${D},Mon,PROJ-A,overtime,2.00`);

  // --- week formats -------------------------------------------------------
  const setSel = (el, value) => { el.value = value; fire(el, 'change'); };
  const fmtSel = $('week-format-input');
  check('every week format is offered', fmtSel.options.length, 4);
  check('the default is five eight-hour days', fmtSel.value, '5x8');
  check('the hint describes it', text('week-format-hint'), 'Monday to Friday, 8 hours each.');

  // Read the targets on an empty period, where no entered hours colour them.
  $('next-period').click();
  const SAT = '2026-08-15';
  const MON = '2026-08-17';
  const FRI_A = '2026-08-21'; // Friday of week 1
  const FRI_B = '2026-08-28'; // Friday of week 2

  check('weekends are never scheduled', target(SAT), 'off');
  check('5x8 targets eight hours on a weekday', target(MON), 'of 8');
  check('5x8 works both Fridays', `${target(FRI_A)} / ${target(FRI_B)}`, 'of 8 / of 8');

  setSel(fmtSel, '4x10');
  check('4x10 targets ten hours', target(MON), 'of 10');
  check('4x10 takes both Fridays off', `${target(FRI_A)} / ${target(FRI_B)}`, 'off / off');

  setSel(fmtSel, '9/80a');
  check('9/80 A targets nine hours', target(MON), 'of 9');
  check('9/80 A takes the first Friday off', `${target(FRI_A)} / ${target(FRI_B)}`, 'off / of 8');
  check('9/80 A week 1 target', q('[data-week-totals="0"]').textContent, 'Worked 0.00 of 36');
  check('9/80 A week 2 target', q('[data-week-totals="1"]').textContent, 'Worked 0.00 of 44');

  setSel(fmtSel, '9/80b');
  check('9/80 B flips the Fridays', `${target(FRI_A)} / ${target(FRI_B)}`, 'of 8 / off');

  // Hours on a day the schedule has off are called out, not counted as met.
  setVal(q(`input[aria-label="Start time ${FRI_B}"]`), '09:00');
  setVal(q(`input[aria-label="End time ${FRI_B}"]`), '13:00');
  check('working an off day is flagged', target(FRI_B), 'not scheduled');
  check('and the day still shows its hours', worked(FRI_B), '4.00');

  // PTO meets a day's target the same as working it does.
  setVal(q(`input[aria-label="PTO hours ${MON}"]`), '9');
  check('a leave day counts as met', target(MON), 'of 9');
  check('and reads as met, not short',
    cell(MON, '.worked').querySelector('.worked__target').className,
    'worked__target worked__target--met');

  store.flushSave(ctx.state);
  check('the week format is saved', store.loadState().weekFormat, '9/80b');
} catch (err) {
  failures += 1;
  log.push(`FAIL  threw: ${err && err.stack ? err.stack : err}`);
} finally {
  restore();
}

check('your saved timecard was restored', localStorage.getItem(STORAGE_KEY), savedData);

globalThis.__smokeResults = { failures, log };
document.getElementById('out').textContent =
  `${failures === 0 ? 'ALL PASS' : failures + ' FAILURES'}\n\n` + log.join('\n');
document.title = failures === 0 ? 'SMOKE PASS' : `SMOKE FAIL (${failures})`;
</script>
</body>
</html>
